name: Docker Build and Push

# 触发条件：推送到 main 分支、推送 v 开头的标签、PR、手动触发
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/标签的重复运行自动取消，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nriet/nriet123
  PYTHON_VERSION: '3.12'
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  # ---------- 质量门禁：镜像构建前必须通过 lint + 单测 ----------
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------- 多架构构建并推送到 Docker Hub ----------
  build-and-push:
    name: Build and Push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality
    # PR 只做质量校验，不推送镜像
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          # 凭据只从仓库 Secrets 读取，绝不硬编码
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=python-cicd-demo
            org.opencontainers.image.description=Python demo service validating multi-arch GitHub Actions CI/CD

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Job summary
        run: |
          {
            echo "### Docker image pushed :rocket:"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像 | \`${{ env.IMAGE_NAME }}\` |"
            echo "| 平台 | \`${{ env.PLATFORMS }}\` |"
            echo "| 触发 | \`${{ github.event_name }}\` / \`${{ github.ref_name }}\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo ""
            echo "<details><summary>镜像标签</summary>"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
